<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.E.T.H.E.R. — Visual Assets Preview</title>
  <style>
    :root {
      --bg-sky-top: #090B1A;
      --bg-sky-mid: #161233;
      --bg-sky-mist: #2E1A47;
      --surface-glass: rgba(15, 18, 36, 0.82);
      --border-arcane: rgba(139, 92, 246, 0.28);
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      background: linear-gradient(180deg, var(--bg-sky-top) 0%, var(--bg-sky-mid) 55%, var(--bg-sky-mist) 100%);
      padding: 32px;
    }

    h1, h2 {
      margin: 0 0 16px;
      letter-spacing: 0.04em;
    }

    .section {
      background: var(--surface-glass);
      border: 1px solid var(--border-arcane);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
      backdrop-filter: blur(12px);
    }

    .pixel-art {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .islands-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 32px;
    }

    .sprite-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px;
      background: rgba(24, 29, 56, 0.55);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 8px;
    }

    .sprite-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .matrix {
      display: grid;
      grid-template-columns: 110px repeat(4, minmax(110px, 1fr));
      gap: 16px;
      align-items: center;
    }

    .matrix-header {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: var(--text-secondary);
    }

    .glyph-name {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      color: var(--text-primary);
    }

    .totem-cell {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background: rgba(9, 11, 26, 0.45);
      border-radius: 8px;
    }

    .totem-wrapper {
      position: relative;
      width: 64px;
      height: 96px;
    }

    .totem-wrapper img {
      width: 64px;
      height: 96px;
      display: block;
    }

    .totem-glyph {
      position: absolute;
      left: 24px;
      top: 40px;
      width: 16px;
      height: 16px;
    }

    .state-healthy {
      color: #10B981;
      filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.65));
    }

    .state-warning {
      color: #F59E0B;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.75));
      animation: pulse-warn 2s ease-in-out infinite;
    }

    .state-critical {
      color: #EF4444;
      filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.90));
      animation: pulse-crit 0.9s infinite;
    }

    .state-unknown {
      color: #64748B;
      filter: none;
    }

    @keyframes pulse-warn {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    @keyframes pulse-crit {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.06); }
    }
  </style>
</head>
<body>
  <h1>A.E.T.H.E.R. — Validação Visual de Assets</h1>

  <div class="section">
    <h2>1. Sprites de Ilhas &amp; Base de Totem</h2>
    <div class="islands-grid">
      <div class="sprite-card">
        <img class="pixel-art" src="../sprites/island-core.webp" width="340" height="260" alt="island-core" />
        <span class="sprite-label">island-core.webp (340x260)</span>
      </div>
      <div class="sprite-card">
        <img class="pixel-art" src="../sprites/island-satellite-a.webp" width="240" height="190" alt="island-satellite-a" />
        <span class="sprite-label">island-satellite-a.webp (240x190)</span>
      </div>
      <div class="sprite-card">
        <img class="pixel-art" src="../sprites/island-satellite-b.webp" width="240" height="190" alt="island-satellite-b" />
        <span class="sprite-label">island-satellite-b.webp (240x190)</span>
      </div>
      <div class="sprite-card">
        <img class="pixel-art" src="../sprites/totem-base.webp" width="64" height="96" alt="totem-base" />
        <span class="sprite-label">totem-base.webp (64x96)</span>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>2. Matriz de Runas (7 PixelGlyphs &times; 4 Estados)</h2>
    <div id="matrix" class="matrix">
      <div></div>
      <div class="matrix-header">healthy</div>
      <div class="matrix-header">warning</div>
      <div class="matrix-header">critical</div>
      <div class="matrix-header">unknown</div>
    </div>
  </div>

  <script>
    const GLYPHS = {
      server: `<path d="M2 2h12v3H2V2zm2 1v1h2V3H4zm7 0v1h1V3h-1z"/><path d="M2 6h12v3H2V6zm2 1v1h2V7H4zm7 0v1h1V7h-1z"/><path d="M2 10h12v3H2v-3zm2 1v1h2v-1H4zm7 0v1h1v-1h-1z"/><path d="M3 13h2v1H3v-1zm8 0h2v1h-2v-1z"/>`,
      n8n: `<path d="M1 6h4v4H1V6zm1 1v2h2V7H2z"/><path d="M11 2h4v4h-4V2zm1 1v2h2V3h-2z"/><path d="M11 10h4v4h-4v-4zm1 1v2h2v-2h-2z"/><path d="M5 7h3v2H5V7zm3-3h3v1H8V4zm0 7h3v1H8v-1zM8 5h1v6H8V5z"/>`,
      globe: `<path d="M5 1h6v1H5V1zM3 2h2v1H3V2zm8 0h2v1h-2V2zM2 3h1v2H2V3zm11 0h1v2h-1V3zM1 5h1v6H1V5zm13 0h1v6h-1V5zM2 11h1v2H2v-2zm11 0h1v2h-1v-2zM3 13h2v1H3v-1zm8 0h2v1h-2v-1zM5 14h6v1H5v-1z"/><path d="M2 7h12v1H2V7zm5-5h1v12H7V2z"/><path d="M5 3h1v2H5V3zm0 8h1v2H5v-2zM4 5h1v6H4V5zm6-2h1v2h-1V3zm0 8h1v2h-1v-2zm1-6h1v6h-1V5z"/><path d="M3 4h10v1H3V4zm0 7h10v1H3v-1z"/>`,
      api: `<path d="M4 4h2v1H4V4zM3 5h2v1H3V5zM2 6h2v1H2V6zM1 7h2v2H1V7zM2 9h2v1H2V9zM3 10h2v1H3v-1zM4 11h2v1H4v-1z"/><path d="M10 4h2v1h-2V4zm1 1h2v1h-2V5zm1 1h2v1h-2V6zm1 1h2v2h-2V7zm-1 2h2v1h-2V9zm-1 1h2v1h-2v-1zm-1 1h2v1h-2v-1z"/><path d="M9 3h1v2H9V3zM8 5h1v2H8V5zM7 7h1v2H7V7zM6 9h1v2H6V9zM5 11h1v2H5v-2z"/>`,
      database: `<path d="M2 1h11v1H2V1zm11 1h1v1h-1V2zM1 2h1v12H1V2zm13 1h1v11h-1V3zM2 14h12v1H2v-1z"/><path d="M4 2h1v4H4V2zm6 0h1v4h-1V2zM5 5h5v1H5V5zm3-2h1v2H8V3z"/><path d="M4 9h8v1H4V9zm0 1h1v4H4v-4zm7 0h1v4h-1v-4zm-6 2h6v1H5v-1z"/>`,
      ai_agent: `<path d="M7 1h2v3H7V1zM7 12h2v3H7v-3zM1 7h3v2H1V7zm11 0h3v2h-3V7z"/><path d="M6 4h4v2H6V4zm0 6h4v2H6v-2zM4 6h2v4H4V6zm6 0h2v4h-2V6z"/><path d="M7 7h2v2H7V7z"/><path d="M3 3h1v1H3V3zm9 0h1v1h-1V3zM3 12h1v1H3v-1zm9 0h1v1h-1v-1z"/>`,
      backup: `<path d="M5 2h4v1H5V2zM3 3h2v1H3V3zm6 0h3v1H9V3zM2 4h1v2H2V4zm10 0h1v2h-1V4zM1 6h1v3H1V6zm12 0h2v3h-2V6zM2 9h2v1H2V9zm10 0h2v1h-2V9z"/><path d="M7 7h3v1H7V7zM6 8h2v1H6V8zm4 0h1v4h-1V8zM7 6h1v1H7V6zm0 3h1v1H7V9zM5 9h1v3H5V9zm1 3h4v1H6v-1z"/>`
    };

    const STATES = ['healthy', 'warning', 'critical', 'unknown'];
    const matrix = document.getElementById('matrix');

    for (const [key, paths] of Object.entries(GLYPHS)) {
      const label = document.createElement('div');
      label.className = 'glyph-name';
      label.textContent = key;
      matrix.appendChild(label);

      for (const state of STATES) {
        const cell = document.createElement('div');
        cell.className = 'totem-cell';
        cell.innerHTML = `
          <div class="totem-wrapper">
            <img class="pixel-art" src="../sprites/totem-base.webp" alt="totem-base" />
            <svg class="totem-glyph state-${state}" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges">
              ${paths}
            </svg>
          </div>
        `;
        matrix.appendChild(cell);
      }
    }
  </script>
</body>
</html>
